<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Diagnostics - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .file-input {
            margin: 15px 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #667eea;
            border-radius: 6px;
            background: white;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #5568d3;
        }
        .results {
            display: none;
        }
        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
        }
        .score-number {
            font-size: 64px;
            font-weight: bold;
            margin: 10px 0;
        }
        .grade {
            font-size: 24px;
            opacity: 0.9;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin: 8px 0;
            border-radius: 4px;
            color: #856404;
        }
        .recommendation {
            background: #d1ecf1;
            border-left: 4px solid #17a2b8;
            padding: 12px;
            margin: 8px 0;
            border-radius: 4px;
            color: #0c5460;
        }
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            color: #721c24;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Personal Finance Diagnostics</h1>
        <p class="subtitle">Upload your transaction CSV to get instant insights</p>

        <div class="info">
            📋 <strong>CSV Format:</strong> Your file should have columns: date, amount, type (income/expense), category, description
        </div>

        <div class="upload-section">
            <div class="file-input">
                <label for="csvFile">Upload Transaction CSV</label>
                <input type="file" id="csvFile" accept=".csv" />
            </div>
            <button onclick="analyzeCsv()">Analyze Finances</button>
        </div>

        <div id="results" class="results">
            <div class="score-card">
                <div>Financial Health Score</div>
                <div class="score-number" id="score">--</div>
                <div class="grade" id="grade">--</div>
            </div>

            <div class="metrics">
                <div class="metric">
                    <div class="metric-label">Total Income</div>
                    <div class="metric-value" id="income">€0</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Total Expenses</div>
                    <div class="metric-value" id="expenses">€0</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Savings Rate</div>
                    <div class="metric-value" id="savingsRate">0%</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">⚠️ Alerts</div>
                <div id="alerts"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 Recommendations</div>
                <div id="recommendations"></div>
            </div>
        </div>
    </div>

    <script>
        function parseCsv(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index]?.trim() || '';
                });
                data.push(row);
            }
            
            return data;
        }

        function analyzeCsv() {
            const fileInput = document.getElementById('csvFile');
            if (!fileInput.files.length) {
                alert('Please select a CSV file first');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = parseCsv(e.target.result);
                    const results = analyzeFinances(data);
                    displayResults(results);
                } catch (error) {
                    document.getElementById('results').innerHTML = 
                        `<div class="error">Error: ${error.message}</div>`;
                    document.getElementById('results').style.display = 'block';
                }
            };
            reader.readAsText(fileInput.files[0]);
        }

        function analyzeFinances(data) {
            let totalIncome = 0;
            let totalExpenses = 0;
            const categories = {};

            data.forEach(row => {
                const amount = parseFloat(row.amount) || 0;
                const type = row.type?.toLowerCase() || '';
                const category = row.category || 'Uncategorized';

                if (type === 'income') {
                    totalIncome += amount;
                } else if (type === 'expense') {
                    totalExpenses += amount;
                    categories[category] = (categories[category] || 0) + amount;
                }
            });

            const savingsRate = totalIncome > 0 ? ((totalIncome - totalExpenses) / totalIncome) * 100 : 0;
            
            // Calculate score
            let score = 0;
            if (savingsRate > 20) score += 40;
            else if (savingsRate > 10) score += 30;
            else if (savingsRate > 0) score += 20;

            if (totalExpenses < totalIncome) score += 30;
            if (totalIncome > 2000) score += 20;
            else if (totalIncome > 1000) score += 10;

            const categoryCount = Object.keys(categories).length;
            if (categoryCount > 5) score += 10;

            const grade = score >= 80 ? 'A - Excellent' : 
                         score >= 60 ? 'B - Good' : 
                         score >= 40 ? 'C - Fair' : 'D - Needs Improvement';

            // Generate alerts
            const alerts = [];
            if (totalExpenses >= totalIncome) {
                alerts.push('Spending meets or exceeds income. Review budget urgently.');
            }
            if (savingsRate < 10) {
                alerts.push('Savings rate below 10%. Aim to raise gradually.');
            }

            // Generate recommendations
            const recommendations = [];
            if (savingsRate < 20) {
                const targetSaving = totalIncome * 0.15 - (totalIncome - totalExpenses);
                recommendations.push(`Increase savings by €${targetSaving.toFixed(0)}/month to reach 15% savings rate.`);
            }

            // Find top spending category
            const topCategory = Object.entries(categories)
                .sort((a, b) => b[1] - a[1])[0];
            if (topCategory && topCategory[1] / totalExpenses > 0.3) {
                recommendations.push(`${topCategory[0]} is ${((topCategory[1]/totalExpenses)*100).toFixed(0)}% of expenses. Consider reducing.`);
            }

            return {
                score: Math.round(score),
                grade,
                income: totalIncome,
                expenses: totalExpenses,
                savingsRate,
                alerts,
                recommendations
            };
        }

        function displayResults(results) {
            document.getElementById('score').textContent = results.score;
            document.getElementById('grade').textContent = results.grade;
            document.getElementById('income').textContent = '€' + results.income.toFixed(2);
            document.getElementById('expenses').textContent = '€' + results.expenses.toFixed(2);
            document.getElementById('savingsRate').textContent = results.savingsRate.toFixed(1) + '%';

            const alertsHtml = results.alerts.length > 0 
                ? results.alerts.map(a => `<div class="alert">${a}</div>`).join('')
                : '<div class="alert">No critical alerts. Keep it up!</div>';
            document.getElementById('alerts').innerHTML = alertsHtml;

            const recHtml = results.recommendations.length > 0
                ? results.recommendations.map(r => `<div class="recommendation">${r}</div>`).join('')
                : '<div class="recommendation">Great job! Keep monitoring your finances.</div>';
            document.getElementById('recommendations').innerHTML = recHtml;

            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
