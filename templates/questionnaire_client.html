<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Health Questionnaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-3xl mx-auto p-6">
        <div id="questionnaire-container" class="bg-white rounded-lg shadow-lg p-8">
            <div id="loading" class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-gray-600">Loading questionnaire...</p>
            </div>
        </div>

        <div class="mt-6 text-center text-sm text-gray-500">
            <p>🔒 Your responses are encrypted and never shared with third parties</p>
        </div>
    </div>

    <script>
        let questionnaireData = null;

        async function loadQuestionnaire() {
            try {
                const response = await fetch('/api/questionnaire');
                if (!response.ok) {
                    throw new Error('Failed to load questionnaire');
                }
                questionnaireData = await response.json();
                renderQuestionnaire();
            } catch (error) {
                console.error('Error loading questionnaire:', error);
                document.getElementById('loading').innerHTML = `
                    <p class="text-red-600">Error loading questionnaire. Please try again later.</p>
                    <button onclick="loadQuestionnaire()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Retry
                    </button>
                `;
            }
        }

        function renderQuestionnaire() {
            const container = document.getElementById('questionnaire-container');
            const questionnaire = questionnaireData.questionnaire;

            container.innerHTML = `
                <h1 class="text-3xl font-bold mb-2 text-gray-900">📋 ${questionnaire.title}</h1>
                <p class="text-gray-600 mb-8">${questionnaire.description}</p>

                <form id="questionnaire-form">
                    ${questionnaire.questions.map(question => renderQuestion(question)).join('')}
                    <div class="flex space-x-4 pt-6">
                        <button type="submit" class="flex-1 px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition">
                            Complete Profile & View Full Report
                        </button>
                        <button type="button" onclick="skipQuestionnaire()" class="px-6 py-3 border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition">
                            Skip for Now
                        </button>
                    </div>
                </form>
            `;

            // Add form submission handler
            document.getElementById('questionnaire-form').addEventListener('submit', handleSubmit);
        }

        function renderQuestion(question) {
            const requiredMark = question.required ? '<span class="text-red-500 text-sm">*Required</span>' : '';

            let inputHtml = '';

            // Check if this should be a larger text area (paragraph-style questions)
            const isParagraphQuestion = question.question.toLowerCase().includes('additional') ||
                                      question.question.toLowerCase().includes('changes') ||
                                      question.question.toLowerCase().includes('expenses') ||
                                      question.question.toLowerCase().includes('debts') ||
                                      question.question.toLowerCase().includes('savings') ||
                                      question.question.toLowerCase().includes('habits') ||
                                      question.question.toLowerCase().includes('goals') ||
                                      question.question.toLowerCase().includes('challenges') ||
                                      question.question.toLowerCase().includes('concerns') ||
                                      question.question.toLowerCase().includes('informações');

            if (question.type === 'text') {
                const rows = isParagraphQuestion ? '6' : '2';
                const placeholder = isParagraphQuestion ? 'Enter your detailed response...' : 'Enter your answer...';
                inputHtml = `
                    <textarea
                        name="${question.id}"
                        rows="${rows}"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="${placeholder}"
                        ${question.required ? 'required' : ''}
                    ></textarea>
                `;
            } else if (question.type === 'single_choice') {
                inputHtml = `
                    <div class="space-y-3">
                        ${question.options.map(option => `
                            <label class="flex items-center p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input
                                    type="radio"
                                    name="${question.id}"
                                    value="${option}"
                                    class="w-4 h-4 text-blue-600 focus:ring-blue-500"
                                    ${question.required ? 'required' : ''}
                                >
                                <span class="ml-3 text-gray-700">${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
            } else if (question.type === 'multiple_choice') {
                inputHtml = `
                    <div class="space-y-3">
                        ${question.options.map(option => `
                            <label class="flex items-center p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                <input
                                    type="checkbox"
                                    name="${question.id}"
                                    value="${option}"
                                    class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                                >
                                <span class="ml-3 text-gray-700">${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
            } else if (question.type === 'yes_no') {
                inputHtml = `
                    <div class="flex space-x-4">
                        <label class="flex-1 flex items-center justify-center p-4 border-2 border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input
                                type="radio"
                                name="${question.id}"
                                value="yes"
                                class="w-4 h-4 text-blue-600 focus:ring-blue-500"
                                ${question.required ? 'required' : ''}
                            >
                            <span class="ml-3 text-lg font-medium text-gray-700">Yes</span>
                        </label>
                        <label class="flex-1 flex items-center justify-center p-4 border-2 border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input
                                type="radio"
                                name="${question.id}"
                                value="no"
                                class="w-4 h-4 text-blue-600 focus:ring-blue-500"
                                ${question.required ? 'required' : ''}
                            >
                            <span class="ml-3 text-lg font-medium text-gray-700">No</span>
                        </label>
                    </div>
                `;
            }

            return `
                <div class="mb-8 pb-8 border-b border-gray-200 last:border-0">
                    <div class="flex items-start mb-3">
                        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800 mr-3">
                            ${question.category}
                        </span>
                        ${requiredMark}
                    </div>

                    <label class="block text-lg font-medium text-gray-900 mb-4">
                        ${question.question}
                    </label>

                    ${inputHtml}
                </div>
            `;
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const responses = {};

            // Handle multiple choice questions
            const multipleChoiceQuestions = questionnaireData.questionnaire.questions.filter(q => q.type === 'multiple_choice');
            multipleChoiceQuestions.forEach(question => {
                const values = formData.getAll(question.id);
                if (values.length > 0) {
                    responses[question.id] = values;
                }
            });

            // Handle other question types
            for (let [key, value] of formData.entries()) {
                if (!responses[key]) { // Skip if already handled as multiple choice
                    responses[key] = value;
                }
            }

            try {
                const response = await fetch('/api/questionnaire/responses', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(responses)
                });

                if (response.ok) {
                    alert('Thank you! Your responses have been saved.');
                    window.location.href = '/';
                } else {
                    throw new Error('Failed to save responses');
                }
            } catch (error) {
                console.error('Error submitting responses:', error);
                alert('Error saving responses. Please try again.');
            }
        }

        function skipQuestionnaire() {
            window.location.href = '/';
        }

        // Load questionnaire when page loads
        document.addEventListener('DOMContentLoaded', loadQuestionnaire);
    </script>
</body>
</html>
