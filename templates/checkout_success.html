<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — Money Diagnostics</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f5f7fa; color:#1f2937; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:white; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.1); padding:3rem 2.5rem; text-align:center; max-width:440px; width:100%; margin:1rem; }
    .icon { font-size:4rem; margin-bottom:1rem; }
    h1 { font-size:1.6rem; font-weight:800; color:#059669; margin-bottom:.75rem; }
    p { color:#6b7280; line-height:1.6; margin-bottom:1.5rem; }
    .btn { display:inline-block; padding:.85rem 2rem; border-radius:8px; font-weight:700; text-decoration:none; font-size:1rem; background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
    .btn:hover { opacity:.88; }
    .note { font-size:.85rem; color:#9ca3af; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Payment Successful!</h1>
    <p>Your account is now active. Please log in to access your full dashboard.</p>
    <a href="/login" class="btn">Go to Login</a>
    <p class="note">If you have any issues accessing your account, contact us.</p>
  </div>
</body>
</html>
